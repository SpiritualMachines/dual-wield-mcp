[project]
name = "dual-wield-mcp"
version = "1.13.3"
description = "MCP server exposing Linux desktop control (screenshot, input, window management) over Wayland"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "mcp[cli]>=1.28.1,<2.0.0",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
]

[project.scripts]
dual-wield-mcp = "dual_wield_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dual_wield_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
